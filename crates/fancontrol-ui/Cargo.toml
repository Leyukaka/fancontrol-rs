[package]
name = "fancontrol-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Desktop UI for fancontrol-rs (egui + eframe)"
publish = false

[dependencies]
fancontrol-core = { workspace = true }
fancontrol-plugins = { workspace = true }
fancontrol-pawnio = { workspace = true }
fancontrol-metrics = { workspace = true }
egui = { workspace = true }
eframe = { workspace = true }
egui_plot = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tray-icon = { version = "0.24.1", default-features = false }
ureq = "3.3.0"
rust-i18n = "4"
sys-locale = "0.3"
bytemuck = { version = "1", features = ["derive"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Registry",
] }
