[package]
name = "fancontrol-metrics"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Metric sinks: local SQLite store, CSV export, OpenTelemetry (opt-in)"
publish = false

[dependencies]
fancontrol-core = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

# Bundled SQLite (no system libsqlite required on Windows CI).
rusqlite = { version = "0.40", default-features = false, features = ["bundled"] }

[dev-dependencies]
tempfile = "3"
