# Weekly dependency and Actions updates (public repos: free alerts / PRs).
version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
    groups:
      # More specific first - Dependabot assigns a crate to the first match.
      egui:
        patterns:
          - "egui"
          - "eframe"
          - "egui_plot"
      cargo:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions
    groups:
      github-actions:
        patterns:
          - "*"
