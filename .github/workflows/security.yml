# Dependency vulnerability scan (Rust advisory DB).
# Complements CodeQL; does not replace it.

name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "20 6 * * 1"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  cargo-audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2.85.11
        with:
          tool: cargo-audit

      - name: Run cargo audit
        # Uses root audit.toml (ignored advisories documented there + docs/SECURITY.md)
        run: cargo audit
