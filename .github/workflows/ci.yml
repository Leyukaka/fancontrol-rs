name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege for build/test (release workflow keeps contents: write).
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Build release
        run: cargo build --workspace --release
      # So maintainers can download a Windows exe from the Actions run when
      # local cargo is blocked (e.g. AppLocker) - not a published release.
      - name: Upload Windows exe
        uses: actions/upload-artifact@v7
        with:
          name: fancontrol-rs-windows-ci
          path: target/release/fancontrol-rs.exe
          if-no-files-found: error
          retention-days: 14
