[workspace]
resolver = "2"
members = [
    "crates/fancontrol-core",
    "crates/fancontrol-plugins",
    "crates/fancontrol-pawnio",
    "crates/fancontrol-ui",
    ".",
]
default-members = ["."]

[workspace.package]
version = "0.1.2"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Leyukaka/fancontrol-rs"
authors = ["Leyukaka"]

[workspace.dependencies]
fancontrol-core = { path = "crates/fancontrol-core" }
fancontrol-plugins = { path = "crates/fancontrol-plugins" }
fancontrol-pawnio = { path = "crates/fancontrol-pawnio" }
fancontrol-ui = { path = "crates/fancontrol-ui" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
directories = "5"

# UI (locked: egui + eframe)
egui = "0.35"
eframe = "0.29"

[package]
name = "fancontrol-rs"
version.workspace = true
edition.workspace = true
description = "A modern, full-featured fan control application for Windows written in Rust"
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["fan", "control", "hardware", "sensors", "windows"]
categories = ["hardware-support", "gui"]

[[bin]]
name = "fancontrol-rs"
path = "src/main.rs"

[dependencies]
fancontrol-core = { workspace = true }
fancontrol-plugins = { workspace = true }
fancontrol-pawnio = { workspace = true }
fancontrol-ui = { workspace = true }

anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
clap = { workspace = true }
serde_json = { workspace = true }

[profile.release]
lto = true
codegen-units = 1
strip = true
