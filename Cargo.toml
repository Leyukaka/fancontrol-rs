[package]
name = "fancontrol-rs"
version = "0.1.0"
edition = "2021"
description = "A modern, full-featured fan control application for Windows written in Rust"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Leyukaka/fancontrol-rs"
readme = "README.md"
keywords = ["fan", "control", "hardware", "sensors", "windows"]
categories = ["hardware-support", "gui"]

[dependencies]
# UI (decision pending: egui vs iced)
# egui = "0.29"
# eframe = "0.29"

# Async / channels
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Logging
tracing = "0.1"
tracing-subscriber = "0.3"

# Error handling
anyhow = "1"
thiserror = "1"

[profile.release]
lto = true
codegen-units = 1
strip = true
