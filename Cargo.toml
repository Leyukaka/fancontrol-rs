[workspace]
resolver = "2"
members = [
    "crates/fancontrol-core",
    "crates/fancontrol-plugins",
    "crates/fancontrol-pawnio",
    "crates/fancontrol-metrics",
    "crates/fancontrol-ui",
    ".",
]
default-members = ["."]

[workspace.package]
version = "0.4.3"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Leyukaka/fancontrol-rs"
authors = ["Leyukaka"]

[workspace.dependencies]
fancontrol-core = { path = "crates/fancontrol-core" }
fancontrol-plugins = { path = "crates/fancontrol-plugins" }
fancontrol-pawnio = { path = "crates/fancontrol-pawnio" }
fancontrol-ui = { path = "crates/fancontrol-ui" }
fancontrol-metrics = { path = "crates/fancontrol-metrics" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
directories = "6"

# UI (egui + eframe) — 0.36 pairs with egui_plot 0.37
egui = "0.36"
eframe = "0.36"
egui_plot = "0.37"

[package]
name = "fancontrol-rs"
version.workspace = true
edition.workspace = true
description = "Windows fan control and CPU/RAM activity monitor in Rust (PawnIO)"
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["fan", "control", "hardware", "sensors", "windows"]
categories = ["hardware-support", "gui"]

[[bin]]
name = "fancontrol-rs"
path = "src/main.rs"

[dependencies]
fancontrol-core = { workspace = true }
fancontrol-plugins = { workspace = true }
fancontrol-pawnio = { workspace = true }
fancontrol-ui = { workspace = true }

anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
clap = { workspace = true }
serde_json = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_Storage_FileSystem",
] }

[build-dependencies]
winresource = "0.1"

# Read automatically by winresource (default "toml" feature) to fill in PE version-resource
# fields that WindowsResource::new() otherwise leaves blank. Incomplete publisher metadata on
# an unsigned PE is itself a mild heuristic signal for some AV engines — this is pure build-time
# metadata, no functional/runtime change.
[package.metadata.winresource]
CompanyName = "Leyukaka"
LegalCopyright = "Copyright (c) 2026 Leyukaka"
OriginalFilename = "fancontrol-rs.exe"
FileDescription = "Windows fan control and CPU/RAM activity (PawnIO)"

[profile.release]
lto = true
codegen-units = 1
strip = true

# Faster local "almost release" builds (no full LTO). Ship with `release` only.
#   cargo build --profile release-fast
#   cargo run --profile release-fast -- ui
[profile.release-fast]
inherits = "release"
lto = false
codegen-units = 16

